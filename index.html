      margin: 0 auto;
      padding: 0 20px

      line-height: 1.2;
      margin: 0

    .hero {
      display: grid;
      grid-template-columns: 132px 1fr;
      gap: 28px;
      align-items: center
    }

    .hero img {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      object-fit: cover;
      object-position: 50% 20%;
      border: 4px solid var(--surface);
      box-shadow: var(--shadow)

    h1 {

      letter-spacing: -.01em

    .role {
      margin: 6px 0 16px;
      color: var(--warm);
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
      font-size: .85rem

    .contact {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 22px;
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: .95rem

    .contact a {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid var(--line)
    }

    .contact a:hover {
      color: var(--accent);
      border-color: var(--accent)
    }

    .contact span {
      color: var(--muted);
      margin-right: 6px
    }

    .strip {
      background: var(--strip);
      color: var(--strip-ink)
    }

    .strip ul {
      list-style: none;
      margin: 0;
      padding: 14px 0;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 24px;
      justify-content: center;
      font-size: .85rem;
      font-weight: 500
    }

    .summary {
      font-size: 1.15rem;
      max-width: 760px;
      margin: 40px 0 8px;
      color: var(--ink)
    }

    .summary b {
      color: var(--accent)
    }

    /* sections */
    section {
      padding: 36px 0 8px
    }

    .sec-title {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 1.5rem;
      margin-bottom: 22px
    }

    .sec-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line)
    }

    /* highlights */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px;
      box-shadow: var(--shadow)
    }

    .card h3 {
      font-size: 1.1rem;
      color: var(--accent);
      margin-bottom: 10px
    }

    .card.wide {
      grid-column: 1/-1
    }

    ul.tick {
      margin: 0;
      padding-left: 1.1em
    }

    ul.tick li {
      margin: 6px 0
    }

    ul.tick li::marker {
      color: var(--warm)
    }

    .card.wide ul {
      columns: 1
    }

    @media(min-width:700px) {
      .card.wide ul {
        columns: 2;
        column-gap: 36px
      }

      .card.wide li {
        break-inside: avoid
      }
    }

    /* experience */
    .job {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      overflow: hidden
    }

    .job summary {
      list-style: none;
      cursor: pointer;
      padding: 20px 22px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 2px 16px;
      align-items: baseline
    }

    .job summary::-webkit-details-marker {
      display: none
    }

    .job summary:hover {
      background: var(--accent-soft)
    }

    .job summary:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px
    }

    .job .co {
      font-family: Georgia, serif;
      font-size: 1.2rem;
      font-weight: 700
    }

    .job .when {
      color: var(--muted);
      font-size: .9rem;
      white-space: nowrap
    }

    .job .title {
      grid-column: 1/-1;
      color: var(--accent);
      font-weight: 600
    }

    .job .meta {
      grid-column: 1/-1;
      color: var(--muted);
      font-size: .88rem
    }

    .job .chev {
      display: none
    }

    .job summary::after {
      content: "Show details";
      grid-column: 1/-1;
      margin-top: 6px;
      font-size: .8rem;
      color: var(--warm);
      font-weight: 600
    }

    .job[open] summary::after {
      content: "Hide details"
    }

    .job .body {
      padding: 4px 22px 22px;
      border-top: 1px solid var(--line)
    }

    .job h4 {
      margin: 18px 0 6px;
      font-size: .78rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted)
    }

    .job ul {
      margin: 0;
      padding-left: 1.1em
    }

    .job li {
      margin: 4px 0
    }

    .job li::marker {
      color: var(--warm)
    }

    .tech {
      font-size: .9rem;
      color: var(--muted);
      margin-top: 14px
    }

    .tech b {
      color: var(--ink)
    }

      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));

    }

    .edu p {
      margin: 0 0 14px
    }

    .edu small {
      color: var(--muted);
      display: block

      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none

  <script>
    /**
     * Markdown Resume Parser & Renderer
     */
    function parseInline(text) {
      if (!text) return '';
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
        .replace(/__(.+?)__/g, '<b>$1</b>')
        .replace(/\*([^\*]+?)\*/g, '<em>$1</em>')
        .replace(/_([^_]+?)_/g, '<em>$1</em>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (match, label, href) {
          var isExt = /^https?:\/\//i.test(href);
          return '<a href="' + href + '"' + (isExt ? ' target="_blank" rel="noopener"' : '') + '>' + label + '</a>';
        })
        .replace(/`([^`]+)`/g, '<code>$1</code>');
    }

    function parseFrontmatter(md) {
      var meta = {
        name: 'Meera Shanaaz Aneez',
        role: 'Technology Leader',
        photo: 'photo.jpg',
        email: '',
        phone: '',
        linkedin: '',
        linkedin_label: '',
        github: '',
        github_label: '',
        pdf: 'Meera-Shanaaz-Aneez-CV.pdf',
        strip: []
      };

      var fmMatch = md.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n/);
      var body = md;
      if (fmMatch) {
        body = md.slice(fmMatch[0].length);
        var lines = fmMatch[1].split(/\r?\n/);
        var currentKey = null;
        var inList = false;

        lines.forEach(function (line) {
          var trimmed = line.trim();
          if (!trimmed || trimmed.startsWith('#')) return;

          var kvMatch = line.match(/^([a-zA-Z0-9_-]+)\s*:\s*(.*)$/);
          if (kvMatch) {
            currentKey = kvMatch[1].toLowerCase();
            var val = kvMatch[2].trim().replace(/^["']|["']$/g, '');
            if (val === '') {
              inList = true;
              if (!meta[currentKey]) meta[currentKey] = [];
            } else {
              inList = false;
              meta[currentKey] = val;
            }
          } else if (inList && currentKey && trimmed.startsWith('-')) {
            var itemVal = trimmed.replace(/^-\s*/, '').replace(/^["']|["']$/g, '');
            if (Array.isArray(meta[currentKey])) {
              meta[currentKey].push(itemVal);
            }
          }
        });
      }

      return { meta: meta, body: body };
    }

    function renderResume(markdown) {
      var parsed = parseFrontmatter(markdown);
      var meta = parsed.meta;
      var body = parsed.body;

      // Dynamically update document title
      if (meta.name && meta.role) {
        document.title = meta.name + ' — ' + meta.role;
      }

      // 1. Header Hero
      var headerHtml = '<header>\n' +
        '  <div class="wrap hero">\n' +
        '    <img src="' + (meta.photo || 'photo.jpg') + '" alt="Photo of ' + meta.name + '" width="132" height="132">\n' +
        '    <div>\n' +
        '      <h1>' + parseInline(meta.name) + '</h1>\n' +
        '      <p class="role">' + parseInline(meta.role) + '</p>\n' +
        '      <ul class="contact">\n' +
        (meta.email ? '        <li><span aria-hidden="true">✉</span><a href="mailto:' + meta.email + '">' + meta.email + '</a></li>\n' : '') +
        (meta.phone ? '        <li><span aria-hidden="true">☏</span><a href="tel:' + meta.phone.replace(/[\s-]/g, '') + '">' + meta.phone + '</a></li>\n' : '') +
        (meta.linkedin ? '        <li><span aria-hidden="true">in</span><a href="' + meta.linkedin + '" rel="noopener" target="_blank">' + (meta.linkedin_label || meta.linkedin.replace(/^https?:\/\/(www\.)?/, '')) + '</a></li>\n' : '') +
        '      </ul>\n' +
        (meta.pdf ? '      <a class="dl" id="dl-pdf" href="' + meta.pdf + '" download="' + meta.pdf + '">&#8681; Download CV (PDF)</a>\n' : '') +
        '    </div>\n' +
        '  </div>\n' +
        '</header>';

      // 2. Strip
      var stripHtml = '';
      if (meta.strip && meta.strip.length) {
        stripHtml = '<div class="strip">\n  <div class="wrap">\n    <ul>\n' +
          meta.strip.map(function (s) { return '      <li>' + parseInline(s) + '</li>'; }).join('\n') +
          '\n    </ul>\n  </div>\n</div>';
      }

      // 3. Sections
      var rawSections = body.split(/\n(?=##\s+)/);
      var summaryHtml = '';
      var highlightsHtml = '';
      var experienceHtml = '';
      var educationHtml = '';
      var competenciesHtml = '';
      var companiesHtml = '';

      rawSections.forEach(function (secText) {
        var trimmed = secText.trim();
        if (!trimmed) return;
        var headerMatch = trimmed.match(/^##\s+(.*)/);
        var secTitle = headerMatch ? headerMatch[1].trim() : '';
        var contentWithoutHeader = headerMatch ? trimmed.slice(headerMatch[0].length).trim() : trimmed;
        var lowerTitle = secTitle.toLowerCase();

        if (lowerTitle.includes('summary')) {
          var paras = contentWithoutHeader.split(/\n\s*\n/).filter(Boolean);
          summaryHtml = paras.map(function (p) {
            return '<p class="summary">' + parseInline(p.trim()) + '</p>';
          }).join('\n');
        } else if (lowerTitle.includes('highlight')) {
          var cardBlocks = contentWithoutHeader.split(/\n(?=###\s+)/);
          var cards = cardBlocks.map(function (cardText, idx) {
            var cMatch = cardText.trim().match(/^###\s+(.*)/);
            if (!cMatch) return '';
            var cardTitle = cMatch[1].trim();
            var cardBody = cardText.trim().slice(cMatch[0].length).trim();
            var items = cardBody.split(/\n/).filter(function (l) {
              return l.trim().startsWith('-');
            }).map(function (l) {
              return l.trim().replace(/^-\s*/, '');
            });
            var isWide = cardTitle.toLowerCase().includes('financial') || (idx === cardBlocks.length - 1 && (cardBlocks.length % 2 === 1));
            return '      <article class="card' + (isWide ? ' wide' : '') + '">\n' +
              '        <h3>' + parseInline(cardTitle) + '</h3>\n' +
              '        <ul class="tick">\n' +
              items.map(function (it) { return '          <li>' + parseInline(it) + '</li>'; }).join('\n') +
              '\n        </ul>\n      </article>';
          }).filter(Boolean);

          highlightsHtml = '<section id="highlights">\n' +
            '    <h2 class="sec-title">' + parseInline(secTitle) + '</h2>\n' +
            '    <div class="cards">\n' + cards.join('\n') + '\n    </div>\n  </section>';
        } else if (lowerTitle.includes('experience')) {
          var jobBlocks = contentWithoutHeader.split(/\n(?=###\s+)/);
          var jobs = jobBlocks.map(function (jobText, idx) {
            var jMatch = jobText.trim().match(/^###\s+(.*)/);
            if (!jMatch) return '';
            var headerLine = jMatch[1].trim();
            var company = headerLine;
            var when = '';

            if (headerLine.includes('|')) {
              var parts = headerLine.split('|');
              company = parts[0].trim();
              when = parts.slice(1).join('|').trim();
            } else if (headerLine.includes('—')) {
              var pDash = headerLine.split('—');
              company = pDash[0].trim();
              when = pDash.slice(1).join('—').trim();
            }

            var remainingLines = jobText.trim().slice(jMatch[0].length).trim().split(/\n/);
            var title = '';
            var metaLine = '';
            var techLine = '';
            var subsections = [];
            var curSub = null;

            for (var i = 0; i < remainingLines.length; i++) {
              var line = remainingLines[i].trim();
              if (!line) continue;

              if (line.startsWith('####')) {
                var subTitle = line.replace(/^####\s*/, '').trim();
                curSub = { title: subTitle, items: [] };
                subsections.push(curSub);
                continue;
              }

              if (curSub && line.startsWith('-')) {
                curSub.items.push(line.replace(/^-\s*/, ''));
                continue;
              }

              if (line.match(/^(\*\*Technologies:?\*\*|Technologies:)/i)) {
                techLine = line.replace(/^(\*\*Technologies:?\*\*|Technologies:)\s*/i, '').trim();
                continue;
              }

              if (!title && line.includes('**')) {
                var boldMatch = line.match(/\*\*(.+?)\*\*/);
                if (boldMatch) {
                  title = boldMatch[1].trim();
                  var rest = line.slice(boldMatch[0].length).replace(/^[\s\|—–]+/, '').trim();
                  if (rest && !when) when = rest;
                }
                continue;
              }

              if (line.startsWith('*') && line.endsWith('*') || line.includes('Reported to:')) {
                metaLine = line.replace(/^\*+|\*+$/g, '').trim();
                continue;
              }
            }

            return '    <details class="job"' + (idx === 0 ? ' open' : '') + '>\n' +
              '      <summary>\n' +
              '        <span class="co">' + parseInline(company) + '</span><span class="when">' + parseInline(when) + '</span>\n' +
              '        <span class="title">' + parseInline(title) + '</span>\n' +
              (metaLine ? '        <span class="meta">' + parseInline(metaLine) + '</span>\n' : '') +
              '      </summary>\n' +
              '      <div class="body">\n' +
              (techLine ? '        <p class="tech"><b>Technologies:</b> ' + parseInline(techLine) + '</p>\n' : '') +
              subsections.map(function (sub) {
                return '        <h4>' + parseInline(sub.title) + '</h4>\n        <ul>\n' +
                  sub.items.map(function (it) { return '          <li>' + parseInline(it) + '</li>'; }).join('\n') +
                  '\n        </ul>';
              }).join('\n') +
              '\n      </div>\n    </details>';
          }).filter(Boolean);

          experienceHtml = '<section id="experience">\n    <h2 class="sec-title">' + parseInline(secTitle) + '</h2>\n' +
            jobs.join('\n\n') + '\n  </section>';
        } else if (lowerTitle.includes('education')) {
          var lines = contentWithoutHeader.split(/\n/).filter(function (l) { return l.trim(); });
          var eduItems = [];
          var curItem = null;

          lines.forEach(function (l) {
            var trimmedLine = l.trim();
            if (trimmedLine.startsWith('-')) {
              var itemContent = trimmedLine.replace(/^-\s*/, '');
              var boldMatch = itemContent.match(/\*\*(.+?)\*\*/);
              if (boldMatch) {
                var degree = boldMatch[1];
                var institution = itemContent.slice(boldMatch[0].length).replace(/^[\s—–-]+/, '').trim();
                curItem = { degree: degree, institution: institution };
                eduItems.push(curItem);
              } else {
                curItem = { degree: itemContent, institution: '' };
                eduItems.push(curItem);
              }
            } else if (curItem && !curItem.institution) {
              curItem.institution = trimmedLine;
            }
          });

          educationHtml = '<section id="education">\n    <h2 class="sec-title">' + parseInline(secTitle) + '</h2>\n' +
            '    <div class="card edu">\n' +
            eduItems.map(function (item, idx) {
              return '      <p' + (idx === eduItems.length - 1 ? ' style="margin:0"' : '') + '><b>' + parseInline(item.degree) + '</b>' +
                (item.institution ? '<small>' + parseInline(item.institution) + '</small>' : '') + '</p>';
            }).join('\n') +
            '\n    </div>\n  </section>';
        } else if (lowerTitle.includes('competenc')) {
          var compBlocks = contentWithoutHeader.split(/\n(?=###\s+)/);
          var compCards = compBlocks.map(function (block) {
            var cMatch = block.trim().match(/^###\s+(.*)/);
            if (!cMatch) return '';
            var catTitle = cMatch[1].trim();
            var items = block.trim().slice(cMatch[0].length).trim().split(/\n/)
              .filter(function (l) { return l.trim().startsWith('-'); })
              .map(function (l) { return l.trim().replace(/^-\s*/, ''); });

            return '      <article class="card">\n' +
              '        <h3>' + parseInline(catTitle) + '</h3>\n' +
              '        <ul class="chips">\n' +
              items.map(function (it) { return '          <li>' + parseInline(it) + '</li>'; }).join('\n') +
              '\n        </ul>\n      </article>';
          }).filter(Boolean);

          competenciesHtml = '<section id="competencies">\n    <h2 class="sec-title">' + parseInline(secTitle) + '</h2>\n' +
            '    <div class="cards comp">\n' + compCards.join('\n') + '\n    </div>\n  </section>';
        } else if (lowerTitle.includes('compan')) {
          var companies = contentWithoutHeader.split(/\n/)
            .filter(function (l) { return l.trim().startsWith('-'); })
            .map(function (l) { return l.trim().replace(/^-\s*/, ''); });

          companiesHtml = '<section id="companies">\n    <h2 class="sec-title">' + parseInline(secTitle) + '</h2>\n' +
            '    <div class="card">\n      <ul class="chips">\n' +
            companies.map(function (c) { return '        <li>' + parseInline(c) + '</li>'; }).join('\n') +
            '\n      </ul>\n    </div>\n  </section>';
        }
      });

      var mainHtml = '<main class="wrap">\n' +
        '  ' + summaryHtml + '\n' +
        '  ' + highlightsHtml + '\n' +
        '  ' + experienceHtml + '\n' +
        '  ' + educationHtml + '\n' +
        '  ' + competenciesHtml + '\n' +
        '  ' + companiesHtml + '\n' +
        '</main>';

      var footerHtml = '<footer class="wrap">\n' +
        '  <span>© <span id="yr">' + new Date().getFullYear() + '</span> ' + parseInline(meta.name) + '</span>\n' +
        '  <span>References on request</span>\n' +
        '</footer>';

      var appEl = document.getElementById('app');
      appEl.innerHTML = headerHtml + '\n' + stripHtml + '\n' + mainHtml + '\n' + footerHtml;

      // Re-bind PDF download handler with meta.pdf filename
      initPdfDownload(meta.pdf || 'Meera-Shanaaz-Aneez-CV.pdf');
    }

    /**
     * PDF Download Handler
     */
    function initPdfDownload(pdfFileName) {
      var btn = document.getElementById('dl-pdf');
      if (!btn) return;
      var FILE = pdfFileName || 'Meera-Shanaaz-Aneez-CV.pdf';
      var LIB = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
      var label = btn.innerHTML;

      function busy(on, txt) {
        btn.style.pointerEvents = on ? 'none' : '';
        btn.innerHTML = on ? txt : label;
      }

      function save(blob) {
        var u = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = u;
        a.download = FILE;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(u); }, 4000);
      }

      function loadLib() {
        return new Promise(function (res, rej) {
          if (window.html2pdf) return res();
          var s = document.createElement('script');
          s.src = LIB;
          s.onload = res;
          s.onerror = rej;
          document.head.appendChild(s);
        });
      }

      function fromPage() {
        var all = document.querySelectorAll('details.job');
        var was = [];
        all.forEach(function (d) { was.push(d.open); d.open = true; });
        document.documentElement.classList.add('pdf-capture');
        var root = document.createElement('div');
        root.id = 'pdf-root';
        ['header', '.strip', 'main', 'footer'].forEach(function (sel) {
          var n = document.querySelector(sel);
          if (n) root.appendChild(n.cloneNode(true));
        });
        var holder = document.createElement('div');
        holder.style.cssText = 'position:absolute;left:-10000px;top:0;width:794px';
        holder.appendChild(root);
        document.body.appendChild(holder);

        return loadLib().then(function () {
          return html2pdf().set({
            margin: [8, 0, 8, 0],
            filename: FILE,
            image: { type: 'jpeg', quality: 0.95 },
            html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', scrollX: 0, scrollY: 0 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
            pagebreak: { mode: ['css', 'legacy'], avoid: ['.card', 'h4', 'li'] }
          }).from(root).save();
        }).finally(function () {
          holder.remove();
          document.documentElement.classList.remove('pdf-capture');
          all.forEach(function (d, i) { d.open = was[i]; });
        });
      }

      btn.onclick = function (e) {
        e.preventDefault();
        busy(true, 'Preparing PDF…');
        fetch(FILE, { cache: 'no-cache' }).then(function (r) {
          if (!r.ok || !/pdf/i.test(r.headers.get('content-type') || '')) throw new Error('no file');
          return r.blob();
        }).then(save).catch(function () {
          busy(true, 'Building PDF…');
          return fromPage().catch(function () { window.print(); });
        }).finally(function () {
          busy(false);
        });
      };
    }

    /**
     * Expand all roles when printing, restore afterwards
     */
    var printOpened = [];
    window.addEventListener('beforeprint', function () {
      printOpened = [];
      document.querySelectorAll('details.job').forEach(function (d, i) {
        if (!d.open) { printOpened.push(i); d.open = true; }
      });
    });
    window.addEventListener('afterprint', function () {
      var all = document.querySelectorAll('details.job');
      printOpened.forEach(function (i) {
        if (all[i]) all[i].open = false;
      });
    });

    /**
     * Content Loader (loads content.md with fallback and live updates)
     */
    var currentMarkdown = '';

    function loadContent() {
      fetch('content.md', { cache: 'no-cache' })
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.text();
        })
        .then(function (text) {
          currentMarkdown = text;
          renderResume(text);
        })
        .catch(function (err) {
          console.warn('Could not load content.md via fetch (normal if opened directly via file://):', err);
          var fallback = document.getElementById('fallback-md');
          if (fallback && fallback.textContent.trim()) {
            currentMarkdown = fallback.textContent.trim();
            renderResume(currentMarkdown);
          }
          if (window.location.protocol === 'file:') {
            var banner = document.getElementById('local-file-banner');
            if (banner) banner.style.display = 'flex';
          }
        });
    }

    // Banner close handler
    var closeBannerBtn = document.getElementById('close-banner');
    if (closeBannerBtn) {
      closeBannerBtn.addEventListener('click', function () {
        var banner = document.getElementById('local-file-banner');
        if (banner) banner.style.display = 'none';
      });
    }

    // File picker for immediate file:// preview
    var fileInput = document.getElementById('md-file-input');
    if (fileInput) {
      fileInput.addEventListener('change', function (e) {
        var file = e.target.files && e.target.files[0];
        if (file) {
          var reader = new FileReader();
          reader.onload = function (evt) {
            currentMarkdown = evt.target.result;
            renderResume(currentMarkdown);
            var banner = document.getElementById('local-file-banner');
            if (banner) banner.style.display = 'none';
          };
          reader.readAsText(file);
        }
      });
    }

    // Drag and drop markdown file onto page
    window.addEventListener('dragover', function (e) { e.preventDefault(); });
    window.addEventListener('drop', function (e) {
      e.preventDefault();
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) {
        var file = e.dataTransfer.files[0];
        if (file.name.endsWith('.md')) {
          var reader = new FileReader();
          reader.onload = function (evt) {
            currentMarkdown = evt.target.result;
            renderResume(currentMarkdown);
            var banner = document.getElementById('local-file-banner');
            if (banner) banner.style.display = 'none';
          };
          reader.readAsText(file);
        }
      }
    });

    // Auto-refresh when tab is focused if running on HTTP/HTTPS
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && window.location.protocol !== 'file:') {
        fetch('content.md', { cache: 'no-cache' })
          .then(function (r) { return r.ok ? r.text() : null; })
          .then(function (txt) {
            if (txt && txt !== currentMarkdown) {
              currentMarkdown = txt;
              renderResume(txt);
            }
          })
          .catch(function () { });
      }
    });

    // Initial load
    loadContent();
  </script>
